<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flood Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
</head>
<body>
<header>
    <h1>Hochwasser-Frühwarnsystem</h1>
    <div class="controls">
        <label>Format:
            <input type="radio" name="format" value="json" checked> JSON
            <input type="radio" name="format" value="xml"> XML
        </label>
        <label><input type="checkbox" id="autoRefresh" checked> Automatisch aktualisieren (10 s)</label>
        <span id="loading">Lade …</span>
    </div>
</header>

<main>
    <div id="error"></div>

    <section class="card">
        <h2>Station</h2>
        <select id="station"></select>
    </section>

    <section class="card">
        <h2>Aktueller Messwert</h2>
        <div id="latest" class="latest">–</div>
    </section>

    <section class="card">
        <h2>Historische Messwerte</h2>
        <form id="filterForm" class="filters">
            <label>Von <input type="datetime-local" id="from"></label>
            <label>Bis <input type="datetime-local" id="to"></label>
            <label>Warnstufe
                <select id="warningLevel">
                    <option value="">alle</option>
                    <option value="NORMAL">NORMAL</option>
                    <option value="WARNING">WARNING</option>
                    <option value="CRITICAL">CRITICAL</option>
                    <option value="UNKNOWN">UNKNOWN</option>
                </select>
            </label>
            <label>Limit <input type="number" id="limit" value="50"></label>
            <button type="submit">Filtern</button>
            <button type="button" id="reset">Zurücksetzen</button>
        </form>
        <p id="updated" class="muted"></p>
        <table id="history">
            <thead>
            <tr>
                <th>Station</th>
                <th>Zeitpunkt</th>
                <th>Wasserstand</th>
                <th>Durchfluss</th>
                <th>Niederschlag</th>
                <th>Akkustand</th>
                <th>Status</th>
                <th>Warnstufe</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Rohantwort des Servers</h2>
        <pre id="raw"></pre>
    </section>
</main>
</body>
</html>
